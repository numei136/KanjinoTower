name: 感想・質問
description: 遊んでの感想や、分からなかったことの質問
title: "[感想・質問] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        遊んでくださり、ありがとうございます。この内容は、**公開されます**。個人情報は、書かないでください。
