function genMap(){
const R=8,C=4,m=[];

}}

if(r===R-2){n.to=[0];continue}
for(let d=-1;d<=1;d++){const k=n.c+d;if(k<0||k>=C)continue;if(d===0||Math.random()<.5)n.to.push(k)}
}
let es=m.flat().filter(n=>n.t==='elite').length;
while(es<2){const cs=m.flat().filter(n=>n.r>=3&&n.r<=5&&n.t!=='elite'),fr=cs.filter(n=>!m.flat().some(x=>x.t==='elite'&&x.r===n.r)),c=fr.length?fr:cs;c[Math.floor(Math.random()*c.length)].t='elite';es++}
G.map=m;m[R-1][0].b=pickBoss();
}

function hitEnemy(d){

function kvSample(d){const toks=[],re=/([MmLlHhVvCcSsQqTtZz])|(-?\d*\.?\d+(?:[eE][-+]?\d+)?)/g;let m;while((m=re.exec(d)))toks.push([m[1],m[2]]);let i=0,cmd=null,x=0,y=0,sx=0,sy=0,lc=null,lq=null;const pts=[];const num=()=>{if(i>=toks.length||toks[i][1]==null)throw 0;const v=parseFloat(toks[i][1]);i++;return v};
 const cubic=(p0,p1,p2,p3)=>{for(let k=1;k<=14;k++){const t=k/14,u=1-t;pts.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]])}};
 const quad=(p0,p1,p2)=>{for(let k=1;k<=10;k++){const t=k/10,u=1-t;pts.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]])}};
 while(i<toks.length){if(toks[i][0]){cmd=toks[i][0];i++;if(cmd==='Z'||cmd==='z'){x=sx;y=sy;continue}}if(!cmd)throw 0;const rel=cmd===cmd.toLowerCase(),c=cmd.toUpperCase();
  if(c==='M'){let nx=num(),ny=num();if(rel){nx+=x;ny+=y}x=nx;y=ny;sx=x;sy=y;pts.push([x,y]);cmd=rel?'l':'L';lc=lq=null}
  else if(c==='L'){let nx=num(),ny=num();if(rel){nx+=x;ny+=y}x=nx;y=ny;pts.push([x,y]);lc=lq=null}
  else if(c==='H'){const nx=num();x=rel?nx+x:nx;pts.push([x,y]);lc=lq=null}
  else if(c==='V'){const ny=num();y=rel?ny+y:ny;pts.push([x,y]);lc=lq=null}
  else if(c==='C'){let a=[num(),num(),num(),num(),num(),num()];if(rel)a=[a[0]+x,a[1]+y,a[2]+x,a[3]+y,a[4]+x,a[5]+y];cubic([x,y],[a[0],a[1]],[a[2],a[3]],[a[4],a[5]]);lc=[a[2],a[3]];x=a[4];y=a[5];lq=null}
  else if(c==='S'){let a=[num(),num(),num(),num()];if(rel)a=[a[0]+x,a[1]+y,a[2]+x,a[3]+y];const c1=lc?[2*x-lc[0],2*y-lc[1]]:[x,y];cubic([x,y],c1,[a[0],a[1]],[a[2],a[3]]);lc=[a[0],a[1]];x=a[2];y=a[3];lq=null}
  else if(c==='Q'){let a=[num(),num(),num(),num()];if(rel)a=[a[0]+x,a[1]+y,a[2]+x,a[3]+y];quad([x,y],[a[0],a[1]],[a[2],a[3]]);lq=[a[0],a[1]];x=a[2];y=a[3];lc=null}
  else if(c==='T'){let a=[num(),num()];if(rel)a=[a[0]+x,a[1]+y];const c1=lq?[2*x-lq[0],2*y-lq[1]]:[x,y];quad([x,y],c1,[a[0],a[1]]);lq=c1;x=a[0];y=a[1];lc=null}
  else i++}
 return pts}
function kvResample(pts,n){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const tot=L[L.length-1];if(!(tot>0))return[pts[0],pts[0]];const out=[];let j=0;for(let k=0;k<n;k++){const t=tot*k/(n-1);while(j<L.length-2&&L[j+1]<t)j++;const seg=(L[j+1]-L[j])||1,r=(t-L[j])/seg;out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*r,pts[j][1]+(pts[j+1][1]-pts[j][1])*r])}return out}
function kvStroke(d){let pts;try{pts=kvSample(d)}catch(e){return null}if(pts.length<2)return null;let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);len/=109;const n=Math.max(5,Math.min(14,Math.floor(len*16)+4));return kvResample(pts,n).flatMap(p=>[+(p[0]/109).toFixed(3),+(p[1]/109).toFixed(3)])}
function kvFromEl(el){return Array.from(el.getElementsByTagName('path')).map(p=>p.getAttribute('d')).filter(Boolean).map(kvStroke).filter(Boolean)}
async function kvConvert(files,want){const g={};let n=0;const add=(hex,el)=>{let ch;try{ch=String.fromCodePoint(parseInt(hex,16))}catch(e){return}if(want&&!want.has(ch)||g[ch])return;const st=kvFromEl(el);if(st.length){g[ch]=st;n++}};
 for(const f of files){if(f.size>120e6)throw new Error(f.name+'：ファイルが大きすぎます(120MBまで)');const t=await f.text(),doc=new DOMParser().parseFromString(t,'text/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error(f.name+'：XMLとして読めません');
  const ks=doc.getElementsByTagName('kanji');if(ks.length){for(const k of ks){const m=/kanji_([0-9a-fA-F]{4,5})$/.exec(k.getAttribute('id')||'');if(m)add(m[1],k)}}
  else{const m=/([0-9a-fA-F]{4,5})\.svg$/i.exec(f.name);if(m)add(m[1],doc.documentElement)}
  await new Promise(r=>setTimeout(r,0))}return g}

 catch(e){m.textContent='変換できませんでした：'+(e&&e.message||e);b.disabled=false}}

/* v5.10.32 sequential enemy actions / node-fixed enemies */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

{const _g=genMap;genMap=function(){const r=_g.apply(this,arguments);try{nodeSeeds()}catch(e){}return r}}
{const _r=render;render=function(){const r=_r.apply(this,arguments);try{if(G&&G.scr==='map'&&nodeSeeds())save()}catch(e){}return r}}
function exSeq(done){const g=G,list=(G.e.ex||[]).map((o,j)=>[o,j]).filter(([o])=>o.cur>0);G.busy=true;let k=0;
 const step=()=>{if(g!==G)return;if(k>=list.length||G.hp<=0){G.busy=false;done();return}const[o,j]=list[k++];const a=curAct(o);o.i++;o.blk=0;const el=document.querySelector('.mn'+(100+j)+' .mk');
  const atk=['atk','pois','curse'].includes(a.t);if(el)el.classList.add(atk?'lunge':'cast');
  setTimeout(()=>{if(g!==G)return;let t='';
   if(atk){const dm=Math.ceil((a.v+o.str)*(G.hwHalf?.5:1));try{sfx('big')}catch(e){}const ap=$('#app');ap.classList.remove('shake');void ap.offsetWidth;ap.classList.add('shake');setTimeout(()=>ap.classList.remove('shake'),400);
    for(let h=0;h<(a.n||1);h++)setTimeout(()=>{if(g!==G)return;hurt(dm);try{refreshPBar()}catch(e){}},h*350);if(a.t==='pois')G.ppoi=(G.ppoi||0)+a.p;if(a.t==='curse')G.disc.push('呪');t=o.k+'の'+a.nm}
   else if(a.t==='def'){o.blk+=a.v;t=o.k+'が防御'}else{o.str+=a.v;t=o.k+'の'+a.nm}
   G.log=t;const lg=document.querySelector('.enemy .log');if(lg)lg.textContent=t;
   setTimeout(()=>{if(g!==G)return;step()},500+(atk?((a.n||1)-1)*350:0))},350)};
 step()}
{const _st=startTurn;startTurn=function(){if(G&&G.exPend&&G.scr==='battle'){G.exPend=false;const g=G;exSeq(()=>{if(g!==G)return;if(G.hp<=0){G.hp=0;G.scr='lose';return render()}_st()});return}return _st.apply(this,arguments)}}
