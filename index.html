function hwR4(P){const l=[];hwCk(l,'筆画数が4本',P.n===4?1:0);if(P.n!==4)return hwFin(l);let vi=0,vb=-1;P.rs.forEach((s,i)=>{const mm=hwM(s.slice(0,26)),d=Math.abs(mm.b.y-mm.a.y);if(d>vb){vb=d;vi=i}});const V=hwM(P.rs[vi].slice(0,26)),rest=[0,1,2,3].filter(i=>i!==vi);

 function hide(){tip.style.display='none'}
 document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip],.card[data-id]');if(!el)return hide();const t=textOf(el);if(!t)return hide();
  tip.innerHTML=t;tip.style.display='block';const r=el.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;let x=r.right+8;if(x+w>innerWidth-4)x=Math.max(4,r.left-w-8);let y=Math.min(Math.max(4,r.top),innerHeight-hh-4);tip.style.left=x+'px';tip.style.top=y+'px'});
 document.addEventListener('mousedown',hide);document.addEventListener('scroll',hide,true);
 const _r=render;render=function(){hide();return _r.apply(this,arguments)};
 // 秘策の表示(説明つき)
 secHtml=function(){const s=G.sec||[];return s.length?`<div class="secs">${s.map(x=>{const c=CARDS[x.id];return `<span class="sec" data-tip="<b>${c?c.name:x.e+'の秘策'}</b>：${c?c.d.replace(/^セット：/,''):''}">🔮${x.e}<small>${{atk:'攻撃した時',hit:'攻撃された時',turn:'次のターン',hand:'手札'+x.n+'枚以上'}[x.trig]}</small></span>`}).join('')}</div>`:''};
 // ターン終了ショートカット(PC)
 const pc=matchMedia('(hover:hover) and (pointer:fine)').matches;
 let K={type:'mouse',code:2};try{const k=JSON.parse(localStorage.getItem('kanjiKey')||'null');if(k&&k.type)K=k}catch(e){}
 let cap=false;
 const kname=k=>k.type==='mouse'?['左クリック','中クリック','右クリック','戻るボタン','進むボタン'][k.code]||('マウス'+k.code):(k.code==='Space'?'スペース':k.code.replace(/^Key/,'').replace(/^Digit/,''));
 window.keyName=()=>kname(K);window.keyCap=()=>cap;
 window.keyStart=function(){cap=true;optMenu()};
 window.keyReset=function(){K={type:'mouse',code:2};try{localStorage.removeItem('kanjiKey')}catch(e){}optMenu()};
 let lastCap=0;
 function save(k){K=k;cap=false;lastCap=Date.now();try{localStorage.setItem('kanjiKey',JSON.stringify(k))}catch(e){}optMenu()}
 function can(){return pc&&G&&G.scr==='battle'&&!G.busy&&!G.tut&&!document.querySelector('.modal')&&!document.getElementById('hd')}
 function go(){if(can())endTurn()}
 document.addEventListener('keydown',e=>{if(cap){e.preventDefault();if(e.code==='Escape'){cap=false;optMenu();return}save({type:'key',code:e.code});return}
  if(K.type==='key'&&e.code===K.code&&!e.repeat&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||'')){e.preventDefault();go()}});
 document.addEventListener('mousedown',e=>{if(cap){if(e.button===0)return;e.preventDefault();save({type:'mouse',code:e.button});return}
  if(K.type==='mouse'&&e.button===K.code&&e.button!==0){if(can()){e.preventDefault();go()}}},true);
 document.addEventListener('contextmenu',e=>{if(cap||Date.now()-lastCap<600||(K.type==='mouse'&&K.code===2&&can()))e.preventDefault()});
 window.keyPc=pc;
})();

newGame();
</script>
